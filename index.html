<style>
/* Layout: full-bleed 3D stage on top, a blackboard control dock with a wooden chalk tray below. */
:root {

.tools {

}
.tool {

const FIXED = [
  [-HX, -HX + .2, -HZ, HZ], [-HX, HX, HZ - .46, HZ], [1.8, 3.2, -HZ, -HZ + .44],
  [-.8, 0, -3.9, -3.3], [-3.42, -2.2, -HZ, -3.58], [-3.1, -2.5, -3.6, -3.0],
  [3.05, HX, -3.95, -2.75], [3.05, HX, 2.75, 3.95],
];
function freeRect(state) {
  const nx = 75, nz = 90, cell = .1, occ = new Uint8Array(nx * nz);
  const mark = (x0, x1, z0, z1) => {
    const a = clamp(Math.floor((x0 + HX) / cell), 0, nx), b = clamp(Math.ceil((x1 + HX) / cell), 0, nx);
    const c = clamp(Math.floor((z0 + HZ) / cell), 0, nz), d = clamp(Math.ceil((z1 + HZ) / cell), 0, nz);
    for (let j = c; j < d; j++) for (let i = a; i < b; i++) occ[j * nx + i] = 1;
  };
  FIXED.forEach(r => mark(...r));
  state.forEach(s => {
    mark(s.d.x - .34, s.d.x + .34, s.d.z - .23, s.d.z + .23);
    if (s.flip) mark(s.c.x - .2, s.c.x + .2, s.c.z - .23, s.c.z + .2);
    else mark(s.c.x - .2, s.c.x + .2, s.c.z - .21, s.c.z + .21);
  });
  const hist = new Int32Array(nx + 1);
  let best = { area: 0 };
  for (let j = 0; j < nz; j++) {
    const st = [];
    for (let i = 0; i <= nx; i++) {
      hist[i] = i < nx && !occ[j * nx + i] ? hist[i] + 1 : 0;
      while (st.length && hist[st[st.length - 1]] >= hist[i]) {
        const h = hist[st.pop()], l = st.length ? st[st.length - 1] + 1 : 0, area = h * (i - l);
        if (area > best.area) best = { area, i0: l, i1: i, j0: j - h + 1, j1: j + 1 };
      }
      st.push(i);
    }
  }
  return { x0: best.i0 * cell - HX, x1: best.i1 * cell - HX, z0: best.j0 * cell - HZ, z1: best.j1 * cell - HZ };
}

function makeAvatar(o) {
  const P = o.P, R = P.head, lr = P.limb * 1.25;

  /* 몸통 */
  const t = new Kit();
  t.box(P.tw * .92, .13, P.td * .95, o.pants, 0, -.07, 0, { r: .035 });
  t.box(P.tw, P.torso, P.td, o.shirt, 0, 0, 0, { r: .05 });
  if (o.stripe) t.box(P.tw + .008, .05, P.td + .008, o.stripe, 0, P.torso * .48, 0, { r: .02 });
  t.cyl(.04 * P.tw / .29, .045 * P.tw / .29, P.neck + .04, 8, o.skin, 0, P.torso - .02, 0);
  if (o.teacher) {
    t.box(.09, P.torso * .88, .01, '#fbf7ea', 0, P.torso * .1, P.td / 2 - .002);
    [-1, 1].forEach(s => t.box(.012, .24, .008, '#d95e4d', s * .05, P.torso - .26, P.td / 2 + .004, { rz: s * .22 }));
    t.box(.036, .028, .05, '#f6d55c', 0, P.torso - .3, P.td / 2 + .012, { r: .008 });
  }
  mesh(t, upper);

  /* 머리: 얼굴은 +z 쪽 */
  const h = new Kit();
  h.ico(R, 2, o.skin, 0, 0, 0);
  [-1, 1].forEach(s => {
    h.ico(R * .22, 1, o.skin, s * R * .97, -R * .06, 0, { sx: .55 });
    h.ico(R * .1, 1, '#2a2522', s * R * .36, -R * .04, R * .9, { sz: .5 });
    h.ico(R * .13, 1, '#f1a093', s * R * .56, -R * .32, R * .78, { sz: .35 });

  h.add(new THREE.SphereGeometry(R * 1.08, 18, 8, 0, Math.PI * 2, 0, Math.PI * .53), o.hair, 0, R * .04, -R * .02, { rx: -.42 });
  const back = o.style === 'short' ? [.95, -.1, -.1, 1] : o.style === 'bob' ? [1.03, -.22, -.1, 1.08] : [1, -.18, -.12, 1];
  h.ico(R * back[0], 1, o.hair, 0, R * back[1], R * back[2], { sx: back[3] });
  if (o.style === 'pony') { h.ico(R * .36, 1, o.hair, 0, R * .1, -R * 1.12); h.ico(R * .3, 1, o.hair, 0, -R * .32, -R * 1.2); h.ico(R * .15, 1, o.band, 0, R * .02, -R * 1.02); }
  if (o.style === 'pigtails') [-1, 1].forEach(s => { h.ico(R * .34, 1, o.hair, s * R * 1.02, -R * .28, -R * .3); h.ico(R * .12, 1, o.band, s * R * .9, -R * .1, -R * .26); });
  if (o.style === 'bun') h.ico(R * .45, 1, o.hair, 0, R * .55, -R * .82);
  if (o.glasses) {
    [-1, 1].forEach(s => h.add(new THREE.TorusGeometry(R * .2, R * .03, 4, 14), '#2c3137', s * R * .36, -R * .03, R * .98));
    h.box(R * .34, R * .03, R * .03, '#2c3137', 0, -R * .02, R * 1.0);
  }
  head.position.y = P.torso + P.neck + R * .95;
  mesh(h, head); upper.add(head);

  /* 팔: 어깨를 축으로 아래로 뻗는다 */
  const arm = s => {
    const g = new THREE.Group(), k = new Kit(), L = P.arm, r = P.limb, sl = o.sleeve;
    g.position.set(s * (P.tw / 2 + r * 1.05), P.torso - r * 1.2, 0);
    k.ico(r * 1.15, 1, o.shirt, 0, 0, 0);
    k.cyl(r, r * .95, L * sl, 8, o.shirt, 0, -L * sl, 0);
    k.cyl(r * .8, r * .75, L * (1 - sl) - r * .5 + .01, 8, o.skin, 0, -L + r * .5, 0);
    k.ico(r * 1.1, 1, o.skin, 0, -L + r * .5, 0);

    return [g, knee];
  };

    vis: 0, want: true, task: null, pending: null, fresh: true, delay: 0,
  };
  root.scale.setScalar(.001); root.visible = false;
  scene.add(root);
  return a;
}

    b.vy -= 9.8 * dt; b.y += b.vy * dt;
    if (b.y <= 0) { b.y = 0; b.vy = Math.abs(b.vy) > .7 ? -b.vy * .5 : 0; }
    p.y = b.r + (Math.hypot(p.x - MAT.x, p.z - MAT.z) < MAT.r ? .035 : .002) + b.y;
    const damp = Math.exp(-.75 * dt); b.vx *= damp; b.vz *= damp;
    if (sp > .001) {
      rotAxis.set(b.vz, 0, -b.vx).normalize();
      rotQ.setFromAxisAngle(rotAxis, sp * dt / b.r);
      b.mesh.quaternion.premultiply(rotQ);
    }
  }
  /* 공끼리 부딪히면 튕겨 나간다 */
  for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) {
    const a = balls[i], c = balls[j], dx = c.mesh.position.x - a.mesh.position.x, dz = c.mesh.position.z - a.mesh.position.z;
    const dist = Math.hypot(dx, dz), min = a.r + c.r;
    if (dist > 0 && dist < min) {
      const nx = dx / dist, nz = dz / dist, push = (min - dist) / 2;
      a.mesh.position.x -= nx * push; a.mesh.position.z -= nz * push;
      c.mesh.position.x += nx * push; c.mesh.position.z += nz * push;
      const rel = (c.vx - a.vx) * nx + (c.vz - a.vz) * nz;
      if (rel < 0) { a.vx += rel * nx * .9; a.vz += rel * nz * .9; c.vx -= rel * nx * .9; c.vz -= rel * nz * .9; }
      moving = true;
    }
  }
  if (moving) shadowDirty = true;
}

/* ---------- 프레임 루프 ---------- */
const targetMin = new THREE.Vector3(-7, 0, -7), targetMax = new THREE.Vector3(7, 3.2, 7);
const clockT = new THREE.Clock();
function frame() {
  const dt = Math.min(clockT.getDelta(), .05);

  if (fly) {
    fly.t = Math.min(1, fly.t + dt / 1.5);
    const e = easeInOut(fly.t);
    camera.position.lerpVectors(fly.p0, fly.p1, e);
    controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (fly.t === 1) fly = null;
  }
  controls.target.clamp(targetMin, targetMax);
  controls.update();
  if (camera.position.y < .22) camera.position.y = .22;
  updateCuts(dt);

  if (layoutClock < 1) {
    layoutClock = Math.min(1, layoutClock + dt / 1.5);
    seats.forEach(s => { s.t = layoutClock * 1.0; applyPose(s); });
    shadowDirty = true;
  }

  /* 놀이 도구: 책상이 비켜난 뒤 차례로 등장 */
  for (const p of props) {
    const on = propWant === 1;
    const gate = on ? clamp(layoutClock * 1.5 - .6 - p.order * .06, 0, 1) : 1;
    const speed = on ? 2.4 : 4.5;
    const next = on ? (gate > 0 ? Math.min(1, p.s + dt * speed) : p.s) : Math.max(0, p.s - dt * speed);
    const final = reduced ? (on ? 1 : 0) : next;
    if (final !== p.s) {
      p.s = final;
      const v = on ? easeOutBack(p.s) : p.s;
      p.obj.scale.setScalar(Math.max(.001, v));
      p.obj.visible = p.s > .001;
      shadowDirty = true;
    }
  }
  updatePeople(dt);
  if (propWant === 1) { kickBalls(); stepBalls(dt); }
  else if (props[props.length - 1].s === 0) balls.forEach(b => {
    b.vx = b.vz = b.vy = b.y = 0;
    b.mesh.position.set(b.home[0], b.r + .035, b.home[1]);
  });

  /* 빈 바닥 표시 */
  const wantA = overlayWant && layoutClock === 1 ? 1 : 0;
  overlayA = reduced ? wantA : clamp(overlayA + Math.sign(wantA - overlayA) * dt * 3, 0, 1);
  overlayLine.opacity = overlayA * .95;
  overlayFill.opacity = overlayA * (current === 'play' ? .05 : .16);
  if (overlay) overlay.visible = overlayA > .01;

  if (!reduced) {
    const fanSpeed = lampsOn ? 5.2 : 0;
    fanBlades.forEach((b, i) => { b.rotation.y += fanSpeed * dt * (i ? 1 : .9); });
    clouds.forEach(c => { c.position.x += c.userData.speed * dt; if (c.position.x > 62) c.position.x = -62; });
  }

  if (shadowDirty) { renderer.shadowMap.needsUpdate = true; shadowDirty = false; }
  renderer.render(scene, camera);
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  /* 좁은 화면에서는 시야를 넓혀 교실 전체가 들어오게 한다 */
  camera.fov = w / h < .9 ? 58 : w / h < 1.3 ? 48 : 40;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

/* ---------- 조작판 ---------- */
document.getElementById('layouts').addEventListener('click', e => { const b = e.target.closest('[data-layout]'); if (b) setLayout(b.dataset.layout); });
document.getElementById('views').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) flyTo(b.dataset.view); });
document.getElementById('timeRange').addEventListener('input', e => setTime(+e.target.value));
document.getElementById('lamp').addEventListener('click', () => setLamps(!lampsOn));
kidsRange.addEventListener('input', e => setStudents(+e.target.value));
document.getElementById('kidsDown').addEventListener('click', () => setStudents(kidCount - 1));
document.getElementById('kidsUp').addEventListener('click', () => setStudents(kidCount + 1));
const zoomBy = f => {
  fly = null;
  const off = camera.position.clone().sub(controls.target);
  off.setLength(clamp(off.length() * f, controls.minDistance, controls.maxDistance));
  camera.position.copy(controls.target).add(off);
};
document.getElementById('zoomIn').addEventListener('click', () => zoomBy(.8));
document.getElementById('zoomOut').addEventListener('click', () => zoomBy(1.25));
document.getElementById('spin').addEventListener('click', e => {
  controls.autoRotate = !controls.autoRotate;
  e.currentTarget.setAttribute('aria-pressed', String(controls.autoRotate));
});
document.getElementById('fold').addEventListener('click', e => {
  const dock = document.getElementById('dock');
  dock.hidden = !dock.hidden;
  e.currentTarget.setAttribute('aria-pressed', String(dock.hidden));
  e.currentTarget.textContent = dock.hidden ? '▴' : '▾';
  e.currentTarget.setAttribute('aria-label', dock.hidden ? '조작판 펼치기' : '조작판 접기');
});

/* ---------- 글꼴이 도착하면 칠판과 게시물을 다시 그린다 ---------- */
const FONT_TEXT = Object.values(boardCopy).flatMap(c => [c.head, c.note, ...c.lines]).join('') + '월일요수목금화토';
const ROUND_TEXT = '급훈함께놀며자라요우리반시간표월화수목금국어학영사회과체육음악미술창도덕작품전시놀이안전약속뛰기에주위를살펴책상쪽으로달리지않아다치면바로선생님께하늘0123456789';
let redrawTimer;
const redrawAll = () => { clearTimeout(redrawTimer); redrawTimer = setTimeout(() => painters.forEach(p => p()), 80); };
if (document.fonts) {
  Promise.all([
    document.fonts.load(`700 60px "Gaegu"`, FONT_TEXT),
    document.fonts.load(`400 40px "Jua"`, ROUND_TEXT),
  ]).then(redrawAll).catch(() => {});
  document.fonts.addEventListener('loadingdone', redrawAll);
}

/* ---------- 시작 ---------- */
resize();
setTime(minutes);
setLamps(true);
setLayout('play', true);
setStudents(kidCount, true);
props.forEach(p => { p.s = 1; p.obj.scale.setScalar(1); p.obj.visible = true; });
overlayA = 1;
renderer.setAnimationLoop(frame);
window.__classroomReady = true;
window.__classroom = { setLayout, flyTo, setTime, setLamps, setStudents, people, camera, controls };
</script>
